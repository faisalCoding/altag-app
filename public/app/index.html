    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f7f5f2;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {

        -webkit-touch-callout: none;
      }

    <script>
      // Offline support: only the deployed build under /app/ registers the worker, never the dev server.
      if ('serviceWorker' in navigator && location.pathname.startsWith('/app/')) {
        addEventListener('load', function () {
          navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(function (error) {
            console.warn('[sw]', error);
          });
        });
      }
    </script>
